<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GridSignal Mini — Utility Incident Intelligence</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              900: '#134e4a',
            },
            gas: '#f97316',
            electric: '#3b82f6',
          }
        }
      }
    }
  </script>
  <!-- React 18 & Babel for standalone browser runtime -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      const [summary, setSummary] = useState(null);
      const [incidents, setIncidents] = useState([]);
      const [alerts, setAlerts] = useState([]);
      const [health, setHealth] = useState(null);
      const [utilityFilter, setUtilityFilter] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [loading, setLoading] = useState(true);
      const [lastSync, setLastSync] = useState(new Date().toLocaleTimeString());
      const [activeTab, setActiveTab] = useState('alerts');

      // Fetch summary, alerts, incidents, health
      const fetchData = async () => {
        setLoading(true);
        try {
          const [hRes, sRes, aRes, iRes] = await Promise.all([
            fetch('/health').then(r => r.json()).catch(() => ({ status: 'offline' })),
            fetch('/summary').then(r => r.json()),
            fetch('/alerts').then(r => r.json()),
            fetch(`/incidents${utilityFilter ? `?utility_type=${utilityFilter}` : ''}`).then(r => r.json()),
          ]);
          setHealth(hRes);
          setSummary(sRes);
          setAlerts(aRes);
          setIncidents(iRes);
          setLastSync(new Date().toLocaleTimeString());
        } catch (err) {
          console.error("Failed to fetch dashboard data:", err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
        const timer = setInterval(fetchData, 15000);
        return () => clearInterval(timer);
      }, [utilityFilter]);

      const filteredIncidents = useMemo(() => {
        return incidents.filter(inc => {
          if (!searchQuery) return true;
          const q = searchQuery.toLowerCase();
          return (
            inc.incident_id.toLowerCase().includes(q) ||
            (inc.area && inc.area.toLowerCase().includes(q)) ||
            inc.severity.toLowerCase().includes(q) ||
            inc.status.toLowerCase().includes(q)
          );
        });
      }, [incidents, searchQuery]);

      return (
        <div class="min-h-screen flex flex-col">
          {/* Top Navigation Bar */}
          <header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap items-center justify-between gap-4">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-teal-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-inner">
                  GS
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <h1 class="text-xl font-bold tracking-tight">GridSignal Mini</h1>
                    <span class="px-2 py-0.5 rounded text-xs font-semibold bg-teal-900/80 text-teal-300 border border-teal-700">
                      FastAPI Edition
                    </span>
                  </div>
                  <p class="text-xs text-slate-400">Utility Incident Intelligence & Hazard Correlation Platform</p>
                </div>
              </div>

              {/* Status and Action Buttons */}
              <div class="flex items-center gap-2.5 flex-wrap">
                <div class="flex items-center space-x-2 text-xs bg-slate-800/90 px-3 py-1.5 rounded-md border border-slate-700">
                  <span class={`inline-block w-2.5 h-2.5 rounded-full ${health?.status === 'ok' ? 'bg-emerald-400 shadow-emerald-400/50 shadow-sm animate-pulse' : 'bg-red-500'}`}></span>
                  <span class="text-slate-300 font-medium">API: {health?.status === 'ok' ? 'Healthy' : 'Connecting...'}</span>
                </div>

                <div class="flex items-center space-x-2 text-xs bg-slate-800/90 px-3 py-1.5 rounded-md border border-slate-700 text-slate-300">
                  <i class="fa-solid fa-satellite-dish text-teal-400"></i>
                  <span>Live Telemetry</span>
                  <span class="text-slate-500 font-mono text-[10px]">({lastSync})</span>
                </div>

                <a 
                  href="/docs"
                  target="_blank"
                  class="px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md border border-slate-700 transition-all flex items-center gap-1.5"
                  title="Open Interactive Swagger Documentation"
                >
                  <i class="fa-solid fa-book-open text-teal-400"></i>
                  Swagger Docs
                </a>

                <button 
                  onClick={fetchData}
                  disabled={loading}
                  class="px-3.5 py-1.5 text-xs font-medium bg-teal-600 hover:bg-teal-500 text-white rounded-md shadow-sm transition-all flex items-center gap-1.5 disabled:opacity-50"
                  title="Reload from API"
                >
                  <i class={`fa-solid fa-arrows-rotate ${loading ? 'animate-spin' : ''}`}></i>
                  Refresh
                </button>
              </div>
            </div>
          </header>

          {/* Main Dashboard Body */}
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1">
            
            {/* 4 Summary Stat Cards */}
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
              {/* Total Incidents */}
              <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm hover:shadow transition-shadow">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Incidents</span>
                  <div class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600">
                    <i class="fa-solid fa-clipboard-list text-sm"></i>
                  </div>
                </div>
                <div class="text-2xl font-bold text-slate-900">{summary ? summary.total_incidents : '—'}</div>
                <div class="text-xs text-slate-500 mt-1">Stored in SQLite</div>
              </div>

              {/* Gas Incidents */}
              <div class="bg-white rounded-xl p-4 border border-orange-100 shadow-sm hover:shadow transition-shadow">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-semibold text-orange-600 uppercase tracking-wider">Gas Incidents</span>
                  <div class="w-8 h-8 rounded-lg bg-orange-50 flex items-center justify-center text-orange-600">
                    <i class="fa-solid fa-fire-flame-simple text-sm"></i>
                  </div>
                </div>
                <div class="text-2xl font-bold text-orange-600">{summary ? summary.total_gas : '—'}</div>
                <div class="text-xs text-slate-500 mt-1">Utility: GAS</div>
              </div>

              {/* Electric Incidents */}
              <div class="bg-white rounded-xl p-4 border border-blue-100 shadow-sm hover:shadow transition-shadow">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">Electric Incidents</span>
                  <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center text-blue-600">
                    <i class="fa-solid fa-bolt text-sm"></i>
                  </div>
                </div>
                <div class="text-2xl font-bold text-blue-600">{summary ? summary.total_electric : '—'}</div>
                <div class="text-xs text-slate-500 mt-1">Utility: ELECTRIC</div>
              </div>

              {/* Correlated Alerts */}
              <div class="bg-white rounded-xl p-4 border border-teal-200 shadow-sm hover:shadow transition-shadow ring-1 ring-teal-500/20">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-semibold text-teal-700 uppercase tracking-wider">Correlated Alerts</span>
                  <div class="w-8 h-8 rounded-lg bg-teal-50 flex items-center justify-center text-teal-700">
                    <i class="fa-solid fa-triangle-exclamation text-sm"></i>
                  </div>
                </div>
                <div class="text-2xl font-bold text-teal-700">{summary ? summary.total_alerts : '—'}</div>
                <div class="text-xs text-teal-600 font-medium mt-1">Unique Pairs ≤200ft, ≤6hr</div>
              </div>
            </div>

            {/* Content Tabs Header */}
            <div class="flex flex-wrap items-center justify-between gap-4 mb-4 border-b border-slate-200 pb-2">
              <div class="flex space-x-2">
                <button
                  onClick={() => setActiveTab('alerts')}
                  class={`px-4 py-2 text-sm font-semibold rounded-lg transition-colors flex items-center gap-2 ${activeTab === 'alerts' ? 'bg-teal-700 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                >
                  <i class="fa-solid fa-triangle-exclamation text-xs"></i>
                  Correlated Alerts
                  <span class={`ml-1.5 px-2 py-0.5 rounded-full text-xs ${activeTab === 'alerts' ? 'bg-teal-800 text-teal-200' : 'bg-slate-100 text-slate-600'}`}>
                    {alerts.length}
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab('incidents')}
                  class={`px-4 py-2 text-sm font-semibold rounded-lg transition-colors flex items-center gap-2 ${activeTab === 'incidents' ? 'bg-teal-700 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}`}
                >
                  <i class="fa-solid fa-list-check text-xs"></i>
                  All Incidents Inventory
                  <span class={`ml-1.5 px-2 py-0.5 rounded-full text-xs ${activeTab === 'incidents' ? 'bg-teal-800 text-teal-200' : 'bg-slate-100 text-slate-600'}`}>
                    {incidents.length}
                  </span>
                </button>
              </div>

              {/* Filtering Controls */}
              {activeTab === 'incidents' && (
                <div class="flex items-center gap-2">
                  <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-slate-400"></i>
                    <input
                      type="text"
                      placeholder="Search ID, area, severity..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      class="pl-8 pr-3 py-1.5 text-xs border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 w-48 sm:w-64"
                    />
                  </div>

                  <select
                    value={utilityFilter}
                    onChange={(e) => setUtilityFilter(e.target.value)}
                    class="text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-500"
                  >
                    <option value="">All Types</option>
                    <option value="GAS">Gas Only</option>
                    <option value="ELECTRIC">Electric Only</option>
                  </select>
                </div>
              )}
            </div>

            {/* TAB 1: Correlated Alert Pairs Table */}
            {activeTab === 'alerts' && (
              <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-5 py-3.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                  <div>
                    <h2 class="text-sm font-bold text-slate-800">Cross-Utility Hazard Alerts</h2>
                    <p class="text-xs text-slate-500">Active correlated alerts between gas and electric infrastructure events.</p>
                  </div>
                  <span class="text-xs text-slate-500 font-mono">Sorted by proximity</span>
                </div>

                {alerts.length === 0 ? (
                  <div class="p-12 text-center text-slate-500">
                    <i class="fa-solid fa-bell-slash text-3xl mb-3 text-slate-300"></i>
                    <p class="text-sm">No correlated alerts found in database.</p>
                    <p class="text-xs text-slate-400 mt-1">Click "Run Seed Import" above to load seed incidents.</p>
                  </div>
                ) : (
                  <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                      <thead class="bg-slate-100 text-slate-600 uppercase tracking-wider font-semibold border-b border-slate-200">
                        <tr>
                          <th class="py-3 px-4">#</th>
                          <th class="py-3 px-4">Gas Incident</th>
                          <th class="py-3 px-4">Electric Incident</th>
                          <th class="py-3 px-4">Planar Distance</th>
                          <th class="py-3 px-4">Time Gap</th>
                          <th class="py-3 px-4">Status</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-100">
                        {alerts.map((alert, idx) => {
                          const isExactBoundaryDist = alert.distance_ft === 200.0;
                          const isExactBoundaryTime = alert.time_gap_minutes === 360.0;
                          return (
                            <tr key={`${alert.gas_incident_id}-${alert.electric_incident_id}`} class="hover:bg-teal-50/40 transition-colors">
                              <td class="py-3.5 px-4 font-mono text-slate-400">{idx + 1}</td>
                              <td class="py-3.5 px-4">
                                <div class="font-bold text-orange-700 flex items-center gap-1.5">
                                  <i class="fa-solid fa-fire-flame-simple text-orange-500 text-xs"></i>
                                  {alert.gas_incident_id}
                                </div>
                                <div class="text-[11px] text-slate-500 mt-0.5">
                                  <span class="font-semibold text-slate-600">{alert.gas_severity || '—'}</span> · {alert.gas_status || '—'}
                                </div>
                              </td>
                              <td class="py-3.5 px-4">
                                <div class="font-bold text-blue-700 flex items-center gap-1.5">
                                  <i class="fa-solid fa-bolt text-blue-500 text-xs"></i>
                                  {alert.electric_incident_id}
                                </div>
                                <div class="text-[11px] text-slate-500 mt-0.5">
                                  <span class="font-semibold text-slate-600">{alert.electric_severity || '—'}</span> · {alert.electric_status || '—'}
                                </div>
                              </td>
                              <td class="py-3.5 px-4">
                                <div class="font-semibold text-slate-900 font-mono">
                                  {alert.distance_ft.toFixed(2)} ft
                                </div>
                                <div class="w-24 bg-slate-100 rounded-full h-1.5 mt-1 overflow-hidden">
                                  <div 
                                    class={`h-1.5 rounded-full ${alert.distance_ft <= 50 ? 'bg-red-500' : alert.distance_ft <= 100 ? 'bg-amber-500' : 'bg-teal-500'}`}
                                    style={{ width: `${Math.min(100, (alert.distance_ft / 200) * 100)}%` }}
                                  ></div>
                                </div>
                              </td>
                              <td class="py-3.5 px-4">
                                <div class="font-semibold text-slate-900 font-mono">
                                  {alert.time_gap_minutes.toFixed(1)} min
                                </div>
                                <div class="text-[11px] text-slate-500">
                                  {(alert.time_gap_minutes / 60).toFixed(2)} hrs
                                </div>
                              </td>
                              <td class="py-3.5 px-4">
                                {(isExactBoundaryDist || isExactBoundaryTime) ? (
                                  <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-purple-100 text-purple-800 border border-purple-200">
                                    <i class="fa-solid fa-crosshairs text-[10px]"></i>
                                    Exact Limit ({isExactBoundaryDist ? '200 ft' : ''} {isExactBoundaryDist && isExactBoundaryTime ? '&' : ''} {isExactBoundaryTime ? '6 hrs' : ''})
                                  </span>
                                ) : (
                                  <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                                    <i class="fa-solid fa-check text-[10px]"></i>
                                    Within Threshold
                                  </span>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: All Incidents Table */}
            {activeTab === 'incidents' && (
              <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="px-5 py-3.5 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                  <div>
                    <h2 class="text-sm font-bold text-slate-800">Incident Inventory</h2>
                    <p class="text-xs text-slate-500">Includes all valid imported records, including those with missing coordinates.</p>
                  </div>
                  <span class="text-xs text-slate-500">Showing {filteredIncidents.length} of {incidents.length}</span>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs">
                    <thead class="bg-slate-100 text-slate-600 uppercase tracking-wider font-semibold border-b border-slate-200">
                      <tr>
                        <th class="py-3 px-4">ID</th>
                        <th class="py-3 px-4">Type</th>
                        <th class="py-3 px-4">Coordinates (x, y)</th>
                        <th class="py-3 px-4">Reported At (UTC)</th>
                        <th class="py-3 px-4">Severity</th>
                        <th class="py-3 px-4">Status</th>
                        <th class="py-3 px-4">Area</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                      {filteredIncidents.map(inc => {
                        const hasCoords = inc.x_ft !== null && inc.y_ft !== null;
                        const isGas = inc.utility_type === 'GAS';
                        return (
                          <tr key={inc.incident_id} class="hover:bg-slate-50 transition-colors">
                            <td class="py-3 px-4 font-mono font-bold text-slate-900">{inc.incident_id}</td>
                            <td class="py-3 px-4">
                              <span class={`inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-semibold ${isGas ? 'bg-orange-100 text-orange-800' : 'bg-blue-100 text-blue-800'}`}>
                                <i class={`fa-solid ${isGas ? 'fa-fire-flame-simple' : 'fa-bolt'} text-[10px]`}></i>
                                {inc.utility_type}
                              </span>
                            </td>
                            <td class="py-3 px-4 font-mono">
                              {hasCoords ? (
                                <span class="text-slate-700">({inc.x_ft}, {inc.y_ft}) ft</span>
                              ) : (
                                <span class="inline-flex items-center gap-1 text-[11px] font-medium text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">
                                  <i class="fa-solid fa-location-crosshairs text-[10px]"></i>
                                  Missing Coords (Excluded from matching)
                                </span>
                              )}
                            </td>
                            <td class="py-3 px-4 font-mono text-slate-600">{inc.reported_at}</td>
                            <td class="py-3 px-4">
                              <span class={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                inc.severity === 'CRITICAL' ? 'bg-rose-100 text-rose-800 border border-rose-200' :
                                inc.severity === 'HIGH' ? 'bg-red-100 text-red-800' :
                                inc.severity === 'MEDIUM' ? 'bg-amber-100 text-amber-800' :
                                'bg-slate-100 text-slate-700'
                              }`}>
                                {inc.severity}
                              </span>
                            </td>
                            <td class="py-3 px-4">
                              <span class={`px-2 py-0.5 rounded text-[10px] font-medium ${
                                inc.status === 'OPEN' ? 'bg-emerald-100 text-emerald-800' :
                                inc.status === 'IN_PROGRESS' ? 'bg-blue-100 text-blue-800' :
                                'bg-slate-100 text-slate-600'
                              }`}>
                                {inc.status}
                              </span>
                            </td>
                            <td class="py-3 px-4 text-slate-600">{inc.area || '—'}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer class="bg-white border-t border-slate-200 text-slate-500 text-xs py-4 mt-auto">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-2">
              <div>GridSignal Mini · Internal Utility Incident Intelligence Platform</div>
              <div class="font-mono text-slate-400">FastAPI + SQLite + React</div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
